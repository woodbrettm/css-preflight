name: "Run Tests"

permissions: {}

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  tests:
    name: "Run Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Prep Node Env"
        uses: ./.github/composite-actions/prep-env
        with:
          cache: true

      - name: "Lint CSS"
        run: pnpm run lint:css
        shell: bash

      - name: "Lint JavaScript"
        run: pnpm run lint:js
        shell: bash

      - name: "Lint Types"
        run: pnpm run lint:types
        shell: bash

      - name: "Run Tests"
        run: pnpm run tests
        shell: bash
